<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تسجيل الدخول — درب</title>
    <meta name="description" content="سجّل دخولك أو أنشئ حساباً جديداً في منصة درب لتوثيق رحلاتك الجبلية." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body data-page="auth">
    <a class="skip-link" href="#main-content">انتقل إلى نموذج الدخول</a>

    <!-- Top Navigation Bar -->
    <header class="site-header">
      <div class="container header-inner">
        <div class="header-start">
          <a href="./index.html" class="brand-logo" aria-label="درب — الصفحة الرئيسية">
            <span class="brand-mark" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 19L9.5 7L14 14.5L17 10.5L21 19H3Z" />
              </svg>
            </span>
            <span class="brand-name">درب</span>
          </a>

          <nav class="main-nav" aria-label="التنقل الرئيسي">
            <a href="./index.html" class="nav-link">رحلاتي</a>
            <a href="./index.html#map" class="nav-link">خريطة الرحلات</a>
            <a href="./index.html#stats" class="nav-link">إحصائياتي</a>
          </nav>
        </div>

        <div class="header-actions">
          <a href="./index.html" class="btn btn-outline">العودة للرئيسية</a>
        </div>
      </div>
    </header>

    <main id="main-content" class="main-content container auth-main">
      <section class="auth-layout">
        <div class="surface-card auth-card">
          <div class="auth-card-head">
            <h1 class="auth-title" id="authHeading">أهلاً بعودتك إلى درب</h1>
            <p class="auth-subtitle" id="authSubtitle">سجّل دخولك لتوثيق مساراتك الجبلية وحفظ ملفات GPX الخاصة بك.</p>
          </div>

          <div class="auth-tabs" role="tablist" aria-label="اختيار وضع الحساب">
            <button type="button" role="tab" class="auth-tab is-active" id="tabLogin" data-auth-mode="login" aria-selected="true">
              تسجيل الدخول
            </button>
            <button type="button" role="tab" class="auth-tab" id="tabRegister" data-auth-mode="register" aria-selected="false">
              إنشاء حساب جديد
            </button>
          </div>

          <div id="authErrorBanner" class="form-error-banner" role="alert" hidden></div>

          <!-- Login Form -->
          <form id="loginForm" class="auth-form" novalidate>
            <div class="form-group">
              <label for="loginEmail" class="form-label">البريد الإلكتروني <span class="required-mark">*</span></label>
              <input
                type="email"
                id="loginEmail"
                name="email"
                class="form-input"
                placeholder="name@example.com"
                autocomplete="email"
                required
              />
            </div>

            <div class="form-group">
              <label for="loginPassword" class="form-label">كلمة المرور <span class="required-mark">*</span></label>
              <input
                type="password"
                id="loginPassword"
                name="password"
                class="form-input"
                placeholder="••••••••"
                autocomplete="current-password"
                required
              />
            </div>

            <button type="submit" class="btn btn-primary btn-block" id="loginSubmitBtn">تسجيل الدخول</button>
          </form>

          <!-- Register Form -->
          <form id="registerForm" class="auth-form" novalidate hidden>
            <div class="form-group">
              <label for="registerName" class="form-label">الاسم الكامل <span class="required-mark">*</span></label>
              <input
                type="text"
                id="registerName"
                name="name"
                class="form-input"
                placeholder="مثال: عبدالله السبيعي"
                autocomplete="name"
                required
              />
            </div>

            <div class="form-group">
              <label for="registerEmail" class="form-label">البريد الإلكتروني <span class="required-mark">*</span></label>
              <input
                type="email"
                id="registerEmail"
                name="email"
                class="form-input"
                placeholder="name@example.com"
                autocomplete="email"
                required
              />
            </div>

            <div class="form-group">
              <label for="registerPassword" class="form-label">كلمة المرور (6 أحرف على الأقل) <span class="required-mark">*</span></label>
              <input
                type="password"
                id="registerPassword"
                name="password"
                class="form-input"
                placeholder="••••••••"
                autocomplete="new-password"
                minlength="6"
                required
              />
            </div>

            <button type="submit" class="btn btn-primary btn-block" id="registerSubmitBtn">إنشاء الحساب</button>
          </form>

          <div class="auth-divider" aria-hidden="true">
            <span>أو</span>
          </div>

          <button type="button" class="btn btn-outline btn-block google-btn" id="googleSignInBtn">
            <svg class="icon-sm" viewBox="0 0 24 24" aria-hidden="true">
              <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.7-2.4 3.6v3h3.9c2.3-2.1 3.5-5.2 3.5-8.8z" />
              <path fill="#34A853" d="M12 24c3.2 0 6-1.1 8-2.9l-3.9-3c-1.1.7-2.5 1.2-4.1 1.2-3.2 0-5.9-2.1-6.9-5H1.1v3.1C3.1 21.3 7.2 24 12 24z" />
              <path fill="#FBBC05" d="M5.1 14.3c-.2-.7-.4-1.5-.4-2.3s.1-1.6.4-2.3V6.6H1.1C.4 8.2 0 10.1 0 12s.4 3.8 1.1 5.4l4-3.1z" />
              <path fill="#EA4335" d="M12 4.8c1.8 0 3.3.6 4.6 1.8l3.4-3.4C17.9 1.2 15.2 0 12 0 7.2 0 3.1 2.7 1.1 6.6l4 3.1c1-2.9 3.7-4.9 6.9-4.9z" />
            </svg>
            <span>المتابعة عبر حساب Google</span>
          </button>
        </div>

        <aside class="auth-visual-card" aria-hidden="true">
          <img
            src="/src/assets/images/hero_alsoudah_mountains_1795369263890.jpg"
            alt=""
            class="auth-visual-img"
            referrerpolicy="no-referrer"
          />
          <div class="auth-visual-scrim"></div>
          <div class="auth-visual-copy">
            <p class="auth-visual-kicker">درب · توثيق المسارات الجبلية</p>
            <h2 class="auth-visual-title">احفظ مساراتك، خرائط GPX، وذكريات كل قمة في مكان واحد.</h2>
          </div>
        </aside>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <p class="footer-brand">درب — لكل رحلة حكاية تستحق أن تُروى</p>
      </div>
    </footer>

    <div id="toastRegion" class="toast-region" aria-live="polite"></div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
